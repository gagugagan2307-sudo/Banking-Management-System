<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | SmartBank</title><link rel="stylesheet" href="/styles.css"></head><body><main class="auth-wrap"><section class="auth-card"><a class="brand" href="/"><span class="brandmark">S</span> Smart<span>Bank</span></a><h1>Welcome back</h1><p>Sign in to your SmartBank demo account.</p><form id="loginForm"><label class="field">Email address<input id="email" type="email" required></label><label class="field">Password<input id="password" type="password" required></label><div id="error" class="message"></div><button class="btn primary wide">Sign in</button></form><p class="notice">New to SmartBank? <a href="/register.html">Create an account</a><br>Educational demo only. Never enter a real banking password.</p></section></main><script src="/app.js"></script><script>
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();showError('error','');try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});localStorage.setItem('sb_token',d.token);location.href='/dashboard.html'}catch(x){showError('error',x.message)}});
</script></body></html>
