<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | SmartBank</title><link rel="stylesheet" href="/styles.css"></head><body class="dash"><header class="dash-head"><a class="brand" href="/"><span class="brandmark">S</span> Smart<span>Bank</span></a><button class="btn-small danger" id="logout">Sign out</button></header><main class="dash-main"><div class="eyebrow">YOUR BANKING OVERVIEW</div><h1 id="welcome">Welcome</h1><p class="muted">Manage your demo accounts and transactions.</p><div id="accounts" class="dash-grid"></div><section class="panel"><h2>Quick banking</h2><div class="form-row"><div><label class="field">Your account<select id="source"></select></label><label class="field">Amount (₹)<input id="amount" type="number" min="0.01" step="0.01"></label><label class="field">Description<input id="description" placeholder="Optional note"></label><button class="btn-small" id="deposit">Deposit</button> <button class="btn-small" id="withdraw">Withdraw</button></div><div><label class="field">Recipient account number<input id="recipient" placeholder="SB..."></label><button class="btn-small" id="transfer">Transfer</button><p id="actionMsg" class="message"></p></div></div></section><section class="panel"><h2>Recent transactions</h2><label class="field">Choose account<select id="historyAccount"></select></label><div id="history"></div></section></main><script src="/app.js"></script><script>
let accountList=[];
async function load(){if(!token()){location.href='/login.html';return}try{const d=await api('/dashboard');document.getElementById('welcome').textContent='Welcome, '+d.name;accountList=d.accounts;const html=d.accounts.map(a=>`<article class="panel"><div class="muted">${a.accountType} ACCOUNT</div><div class="balance">${money(a.balance)}</div><b>${a.accountNumber}</b><p class="muted">Status: ${a.status}</p></article>`).join('');document.getElementById('accounts').innerHTML=html||'<p>No accounts found.</p>';['source','historyAccount'].forEach(id=>document.getElementById(id).innerHTML=d.accounts.map(a=>`<option value="${a.accountNumber}">${a.accountNumber} (${a.accountType})</option>`).join(''));if(d.accounts.length)loadHistory()}catch(e){localStorage.removeItem('sb_token');location.href='/login.html'}}
async function loadHistory(){const n=document.getElementById('historyAccount').value;if(!n)return;try{const rows=await api('/transactions?accountNumber='+encodeURIComponent(n));document.getElementById('history').innerHTML=rows.length?'<table class="table"><tr><th>Type</th><th>Amount</th><th>Description</th><th>Date</th></tr>'+rows.map(t=>`<tr><td>${t.transactionType}</td><td>${money(t.amount)}</td><td>${t.description||''}</td><td>${t.createdAt}</td></tr>`).join('')+'</table>':'<p class="muted">No transactions yet.</p>'}catch(e){showError('actionMsg',e.message)}}
async function moneyAction(path,body){showError('actionMsg','');try{const d=await api(path,{method:'POST',body:JSON.stringify(body)});showError('actionMsg',d.message);await load()}catch(e){showError('actionMsg',e.message)}}
document.getElementById('deposit').onclick=()=>moneyAction('/deposit',{accountNumber:source.value,amount:Number(amount.value),description:description.value});
document.getElementById('withdraw').onclick=()=>moneyAction('/withdraw',{accountNumber:source.value,amount:Number(amount.value),description:description.value});
document.getElementById('transfer').onclick=()=>moneyAction('/transfer',{fromAccount:source.value,toAccount:recipient.value,amount:Number(amount.value),description:description.value});
document.getElementById('historyAccount').onchange=loadHistory;
document.getElementById('logout').onclick=async()=>{try{await api('/auth/logout',{method:'POST'})}finally{localStorage.removeItem('sb_token');location.href='/'}};
load();
</script></body></html>
