<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open account | SmartBank</title><link rel="stylesheet" href="/styles.css"></head><body><main class="auth-wrap"><section class="auth-card"><a class="brand" href="/"><span class="brandmark">S</span> Smart<span>Bank</span></a><h1>Open your demo account</h1><p>Register to explore the SmartBank college project.</p><form id="regForm"><label class="field">Full name<input id="name" required maxlength="100"></label><label class="field">Email<input id="email" type="email" required></label><label class="field">Phone (optional)<input id="phone"></label><label class="field">Password (minimum 8 characters)<input id="password" type="password" minlength="8" required></label><label class="field">Account type<select id="type"><option value="SAVINGS">Savings</option><option value="CURRENT">Current</option></select></label><label class="field">Opening balance (₹)<input id="balance" type="number" min="0" step="0.01" value="1000" required></label><div id="error" class="message"></div><button class="btn primary wide">Create account</button></form><p class="notice">Already registered? <a href="/login.html">Sign in</a>. Demo funds have no real-world value.</p></section></main><script src="/app.js"></script><script>
document.getElementById('regForm').addEventListener('submit',async e=>{e.preventDefault();showError('error','');try{const d=await api('/auth/register',{method:'POST',body:JSON.stringify({fullName:name.value,email:email.value,phone:phone.value,password:password.value,accountType:type.value,openingBalance:Number(balance.value)})});localStorage.setItem('sb_token',d.token);location.href='/dashboard.html'}catch(x){showError('error',x.message)}});
</script></body></html>
